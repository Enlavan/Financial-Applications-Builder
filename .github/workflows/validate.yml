name: Validate skill pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate public package
        run: python -B dev/validate_release.py
      - name: Run offline helper tests
        run: python -B -m unittest discover -s dev -v
      - name: Check financial examples
        run: python -B scripts/financial_checks.py --self-test
